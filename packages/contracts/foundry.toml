[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read-write", path = "./" }]
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.arc.network"
unichain_sepolia = "https://sepolia.unichain.org"
