          - heading "Create on Arc." [level=3] [ref=f9e66]
          - paragraph [ref=f9e67]: Name, ticker, optional first buy. Supply is one billion. The quote asset is native USDC — the same token that pays gas on Arc.
      - article [ref=f9e68]:
        - generic [ref=f9e80]:
          - paragraph [ref=f9e81]: "02"
          - heading "Fill the USDC curve." [level=3] [ref=f9e82]
          - paragraph [ref=f9e83]: Buys and sells hit a constant-product bonding curve. 1.0% protocol + 0.5% creator, taken in USDC. You can exit on the curve before it fills.
      - article [ref=f9e84]:
        - generic [ref=f9e101]:
          - paragraph [ref=f9e102]: "03"
          - heading "Book, then Uniswap." [level=3] [ref=f9e103]
          - paragraph [ref=f9e104]: At $80 the remaining inventory and USDC mint a locked Uniswap pair. An on-chain order book opens on the same ticket. Market walks the book (price-time); leftover hits the pair at 0.30%. Limits rest. LP burns to 0xdead.
