          - heading "Fill the USDC curve." [level=3] [ref=f10e82]
          - paragraph [ref=f10e83]: Buys and sells hit a constant-product bonding curve. 1.0% protocol + 0.5% creator, taken in USDC. You can exit on the curve before it fills.
      - article [ref=f10e84]:
        - generic [ref=f10e101]:
          - paragraph [ref=f10e102]: "03"
          - heading "Book, then Uniswap." [level=3] [ref=f10e103]
          - paragraph [ref=f10e104]: At $80 the remaining inventory and USDC mint a locked Uniswap pair. An on-chain order book opens on the same ticket. Market walks the book (price-time); leftover hits the pair at 0.30%. Limits rest. LP burns to 0xdead.
